name: Gerar APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Criar o projeto do launcher
        run: |
          mkdir -p 'app'
          cat > 'app/build.gradle' <<'EOF_ARQUIVO'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'br.eduardo.p80launcher'
              compileSdk 34

              defaultConfig {
                  applicationId 'br.eduardo.p80launcher'
                  minSdk 21
                  targetSdk 28
                  versionCode((System.getenv('GITHUB_RUN_NUMBER') ?: '1') as Integer)
                  versionName '1.0'
              }

              signingConfigs {
                  fixa {
                      storeFile file('p80launcher.keystore')
                      storePassword 'p80launcher'
                      keyAlias 'p80launcher'
                      keyPassword 'p80launcher'
                  }
              }

              buildTypes {
                  debug {
                      signingConfig signingConfigs.fixa
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }

              lint {
                  abortOnError false
                  checkReleaseBuilds false
              }
          }
          EOF_ARQUIVO
