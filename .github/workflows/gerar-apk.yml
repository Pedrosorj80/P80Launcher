          cat > 'app/src/main/java/br/eduarda/launcher/MainActivity.java' <<'EOF_ARQUIVO'
          package br.eduarda.launcher;

          import android.Manifest;
          import android.app.Activity;
          import android.app.AlertDialog;
          import android.app.WallpaperManager;
          import android.content.ActivityNotFoundException;
          import android.content.DialogInterface;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.os.Handler;
          import android.os.Looper;
          import android.provider.Settings;
          import android.view.TextureView;
          import android.view.View;
          import android.widget.ImageView;
          import android.widget.TextView;
          import android.widget.Toast;

          import java.io.File;
          import java.io.FileInputStream;
          import java.io.IOException;
          import java.io.InputStream;
          import java.text.SimpleDateFormat;
          import java.util.Date;
          import java.util.List;
          import java.util.Locale;

          public class MainActivity extends Activity {

              private static final int REQ_PICK_IMAGE = 1;
              private static final int REQ_STORAGE = 2;
              private static final int REQ_PICK_VIDEO = 3;
              private static final Locale PT_BR = new Locale("pt", "BR");

              private BackgroundManager background;
              private TextView clock;
              private TextView date;
              private TextView carouselLabel;
              private CarouselView carousel;

              private final Handler handler = new Handler(Looper.getMainLooper());
              private final Runnable tick = new Runnable() {
                  @Override
                  public void run() {
                      updateClock();
                      handler.postDelayed(this, 1000);
                  }
              };

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);

                  background = new BackgroundManager(this,
                          (ImageView) findViewById(R.id.wallpaper), (TextureView) findViewById(R.id.video));
                  clock = findViewById(R.id.clock);
                  date = findViewById(R.id.date);
                  carouselLabel = findViewById(R.id.carouselLabel);
                  carousel = findViewById(R.id.carousel);

                  carousel.setListener(new CarouselView.Listener() {
                      @Override
                      public void onCenterChanged(AppItem item) {
                          carouselLabel.setText(item != null ? item.label
                                  : "Fileira vazia — abra “Todos os apps” e segure OK num app para adicioná-lo");
                      }
                  });
                  carousel.setOnClickListener(new View.OnClickListener() {
                      @Override
                      public void onClick(View v) {
                          AppItem item = carousel.getCenterItem();
                          if (item != null) AppRepository.launch(MainActivity.this, item);
                          else openAllApps();
                      }
                  });
                  carousel.setOnLongClickListener(new View.OnLongClickListener() {
                      @Override
                      public boolean onLongClick(View v) {
                          confirmRemove(carousel.getCenterItem());
                          return true;
                      }
                  });

                  findViewById(R.id.btnApps).setOnClickListener(new View.OnClickListener() {
                      @Override
                      public void onClick(View v) {
                          openAllApps();
                      }
                  });
                  findViewById(R.id.btnWallpaper).setOnClickListener(new View.OnClickListener() {
                      @Override
                      public void onClick(View v) {
                          showWallpaperMenu();
                      }
                  });
                  findViewById(R.id.btnSettings).setOnClickListener(new View.OnClickListener() {
                      @Override
                      public void onClick(View v) {
                          try {
                              startActivity(new Intent(Settings.ACTION_SETTINGS));
                          } catch (ActivityNotFoundException e) {
                              Toast.makeText(MainActivity.this, "Configurações indisponíveis", Toast.LENGTH_SHORT).show();
                          }
                      }
                  });

                  carousel.requestFocus();
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  background.onResume();
                  reloadApps();
                  handler.removeCallbacks(tick);
                  handler.post(tick);
              }

              @Override
              protected void onPause() {
                  super.onPause();
                  background.onPause();
                  handler.removeCallbacks(tick);
              }

              @Override
              protected void onNewIntent(Intent intent) {
                  super.onNewIntent(intent);
                  // Apertou "Home" estando aqui: volta o foco para a fileira
                  carousel.requestFocus();
              }

              @Override
              public void onBackPressed() {
                  // Tela inicial: o botão Voltar não fecha o launcher
              }

              private void reloadApps() {
                  List<AppItem> all = AppRepository.loadAllApps(this);
                  carousel.setItems(AppRepository.favoriteItems(this, all));
              }

              private void openAllApps() {
                  startActivity(new Intent(this, AppsActivity.class));
              }

              private void confirmRemove(final AppItem item) {
                  if (item == null) return;
                  new AlertDialog.Builder(this)
                          .setTitle(item.label)
                          .setMessage("Tirar este app da fileira?")
                          .setPositiveButton("Tirar", new DialogInterface.OnClickListener() {
                              @Override
                              public void onClick(DialogInterface d, int w) {
                                  AppRepository.toggleFavorite(MainActivity.this, item.packageName);
                                  reloadApps();
                              }
                          })
                          .setNegativeButton("Cancelar", null)
                          .show();
              }

              // ---------- Relógio e data ----------

              private void updateClock() {
                  Date now = new Date();
                  clock.setText(new SimpleDateFormat("HH:mm", PT_BR).format(now));
                  String d = new SimpleDateFormat("EEEE, d 'de' MMMM 'de' yyyy", PT_BR).format(now);
                  if (!d.isEmpty()) d = d.substring(0, 1).toUpperCase(PT_BR) + d.substring(1);
                  date.setText(d);
              }

              // ---------- Papel de parede ----------

              private interface Opener {
                  InputStream open() throws IOException;
              }

              /** Copia o arquivo em segundo plano (vídeos podem ser grandes) e aplica. */
              private void importAsync(final Opener opener, final boolean isVideo) {
                  Toast.makeText(this, isVideo ? "Copiando o vídeo, aguarde..." : "Aplicando...", Toast.LENGTH_SHORT).show();
                  new Thread(new Runnable() {
                      @Override
                      public void run() {
                          boolean ok;
                          try {
                              ok = BackgroundManager.importFile(MainActivity.this, opener.open(), isVideo);
                          } catch (IOException | SecurityException e) {
                              ok = false;
                          }
                          final boolean result = ok;
                          runOnUiThread(new Runnable() {
                              @Override
                              public void run() {
                                  if (result) {
                                      BackgroundManager.setMode(MainActivity.this,
                                              isVideo ? BackgroundManager.MODE_VIDEO : BackgroundManager.MODE_IMAGE);
                                      background.apply();
                                  }
                                  Toast.makeText(MainActivity.this,
                                          result ? "Papel de parede aplicado!" : "Não consegui usar esse arquivo",
                                          Toast.LENGTH_SHORT).show();
                              }
                          });
                      }
                  }).start();
              }

              private void showWallpaperMenu() {
                  String[] options = {
                          "Imagem ou GIF animado",
                          "Vídeo animado (MP4 em loop)",
                          "Arquivo \"papel_de_parede\" da pasta Download",
                          "Live wallpaper do Android",
                          "Voltar ao fundo padrão"
                  };
                  new AlertDialog.Builder(this)
                          .setTitle("Papel de parede")
                          .setItems(options, new DialogInterface.OnClickListener() {
                              @Override
                              public void onClick(DialogInterface d, int which) {
                                  switch (which) {
                                      case 0: pick("image/*", REQ_PICK_IMAGE); break;
                                      case 1: pick("video/*", REQ_PICK_VIDEO); break;
                                      case 2: loadFromDownloadWithPermission(); break;
                                      case 3: chooseSystemLiveWallpaper(); break;
                                      default:
                                          BackgroundManager.setMode(MainActivity.this, BackgroundManager.MODE_DEFAULT);
                                          background.apply();
                                  }
                              }
                          })
                          .show();
              }

              private void pick(String type, int requestCode) {
                  Intent i = new Intent(Intent.ACTION_GET_CONTENT);
                  i.setType(type);
                  i.addCategory(Intent.CATEGORY_OPENABLE);
                  if (i.resolveActivity(getPackageManager()) != null) {
                      try {
                          startActivityForResult(i, requestCode);
                          return;
                      } catch (ActivityNotFoundException ignored) { }
                  }
                  Toast.makeText(this, "Sua TV box não tem seletor de arquivos. Use a opção da pasta Download.",
                          Toast.LENGTH_LONG).show();
              }

              private void chooseSystemLiveWallpaper() {
                  WallpaperManager wm = WallpaperManager.getInstance(this);
                  boolean supported = wm != null && (Build.VERSION.SDK_INT < 24 || wm.isWallpaperSupported());
                  if (!supported) {
                      Toast.makeText(this, "Esta TV box não aceita live wallpapers do Android. Use a opção de vídeo animado.",
                              Toast.LENGTH_LONG).show();
                      return;
                  }
                  BackgroundManager.setMode(this, BackgroundManager.MODE_SYSTEM);
                  background.apply();
                  Intent[] tries = {
                          new Intent(WallpaperManager.ACTION_LIVE_WALLPAPER_CHOOSER),
                          Intent.createChooser(new Intent(Intent.ACTION_SET_WALLPAPER), "Escolher papel de parede")
                  };
                  for (Intent t : tries) {
                      try {
                          startActivity(t);
                          return;
                      } catch (ActivityNotFoundException | SecurityException ignored) { }
                  }
                  Toast.makeText(this, "Não há seletor de live wallpaper. Instale um app de live wallpaper e escolha por ele.",
                          Toast.LENGTH_LONG).show();
              }

              private void loadFromDownloadWithPermission() {
                  if (Build.VERSION.SDK_INT >= 23
                          && checkSelfPermission(Manifest.permission.READ_EXTERNAL_STORAGE)
                          != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(new String[]{Manifest.permission.READ_EXTERNAL_STORAGE}, REQ_STORAGE);
                      return;
                  }
                  loadFromDownload();
              }

              private void loadFromDownload() {
                  File dir = Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS);
                  String[] exts = {"mp4", "gif", "webp", "jpg", "jpeg", "png"};
                  for (String ext : exts) {
                      final File f = new File(dir, "papel_de_parede." + ext);
                      if (f.exists()) {
                          importAsync(new Opener() {
                              @Override
                              public InputStream open() throws IOException {
                                  return new FileInputStream(f);
                              }
                          }, ext.equals("mp4"));
                          return;
                      }
                  }
                  Toast.makeText(this, "Coloque papel_de_parede.mp4 (ou .gif/.jpg/.png) em " + dir.getAbsolutePath(),
                          Toast.LENGTH_LONG).show();
              }

              @Override
              public void onRequestPermissionsResult(int requestCode, String[] permissions, int[] grantResults) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults);
                  if (requestCode == REQ_STORAGE) {
                      if (grantResults.length > 0 && grantResults[0] == PackageManager.PERMISSION_GRANTED) {
                          loadFromDownload();
                      } else {
                          Toast.makeText(this, "Sem permissão para ler a pasta Download", Toast.LENGTH_LONG).show();
                      }
                  }
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if ((requestCode == REQ_PICK_IMAGE || requestCode == REQ_PICK_VIDEO)
                          && resultCode == RESULT_OK && data != null && data.getData() != null) {
                      final Uri uri = data.getData();
                      importAsync(new Opener() {
                          @Override
                          public InputStream open() throws IOException {
                              return getContentResolver().openInputStream(uri);
                          }
                      }, requestCode == REQ_PICK_VIDEO);
                  }
              }
          }
