          package br.eduardo.p80launcher;

          import android.content.Context;
          import android.graphics.Bitmap;
          import android.graphics.BitmapFactory;
          import android.graphics.drawable.BitmapDrawable;
          import android.graphics.drawable.Drawable;

          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.IOException;
          import java.io.InputStream;
          import java.io.OutputStream;

          /** Guarda as imagens que substituem os ícones dos apps. */
          public final class IconStore {

              private static final int MAX_PX = 512;

              private IconStore() { }

              private static File file(Context ctx, String pkg) {
                  File dir = new File(ctx.getFilesDir(), "icones");
                  if (!dir.exists()) dir.mkdirs();
                  return new File(dir, pkg + ".img");
              }

              public static boolean has(Context ctx, String pkg) {
                  return file(ctx, pkg).exists();
              }

              public static void clear(Context ctx, String pkg) {
                  file(ctx, pkg).delete();
              }

              public static boolean save(Context ctx, String pkg, InputStream in) {
                  if (in == null) return false;
                  File dest = file(ctx, pkg);
                  File tmp = new File(dest.getParentFile(), pkg + ".tmp");
                  OutputStream out = null;
                  try {
                      out = new FileOutputStream(tmp);
                      byte[] buf = new byte[16 * 1024];
                      int n;
                      while ((n = in.read(buf)) > 0) out.write(buf, 0, n);
                      out.close();
                      out = null;
                      BitmapFactory.Options o = new BitmapFactory.Options();
                      o.inJustDecodeBounds = true;
                      BitmapFactory.decodeFile(tmp.getAbsolutePath(), o);
                      if (o.outWidth <= 0 || o.outHeight <= 0) {
                          tmp.delete();
                          return false;
                      }
                      dest.delete();
                      return tmp.renameTo(dest);
                  } catch (IOException e) {
                      tmp.delete();
                      return false;
                  } finally {
                      try { in.close(); } catch (IOException ignored) { }
                      if (out != null) try { out.close(); } catch (IOException ignored) { }
                  }
              }

              public static Drawable load(Context ctx, String pkg) {
                  File f = file(ctx, pkg);
                  if (!f.exists()) return null;
                  BitmapFactory.Options o = new BitmapFactory.Options();
                  o.inJustDecodeBounds = true;
                  BitmapFactory.decodeFile(f.getAbsolutePath(), o);
                  int sample = 1;
                  while (o.outWidth / (sample * 2) >= MAX_PX && o.outHeight / (sample * 2) >= MAX_PX) sample *= 2;
                  o.inJustDecodeBounds = false;
                  o.inSampleSize = sample;
                  try {
                      Bitmap b = BitmapFactory.decodeFile(f.getAbsolutePath(), o);
                      return b == null ? null : new BitmapDrawable(ctx.getResources(), b);
                  } catch (OutOfMemoryError e) {
                      return null;
                  }
              }
          }
