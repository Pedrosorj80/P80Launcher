name: Gerar APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Criar o projeto do launcher
        run: |
          mkdir -p 'app'
          cat > 'app/build.gradle' <<'EOF_ARQUIVO'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'br.eduarda.launcher'
              compileSdk 34

              defaultConfig {
                  applicationId 'br.eduarda.launcher'
                  minSdk 21
                  targetSdk 28
                  versionCode 1
                  versionName '1.0'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }

              lint {
                  abortOnError false
                  checkReleaseBuilds false
              }
          }
          EOF_ARQUIVO
          mkdir -p 'app/src/main'
          cat > 'app/src/main/AndroidManifest.xml' <<'EOF_ARQUIVO'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-feature android:name="android.software.leanback" android:required="false" />
              <uses-feature android:name="android.hardware.touchscreen" android:required="false" />

              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />

              <queries>
                  <intent>
                      <action android:name="android.intent.action.MAIN" />
                  </intent>
              </queries>

              <application
                  android:allowBackup="true"
                  android:banner="@drawable/banner"
                  android:icon="@drawable/ic_launcher"
                  android:label="Meu Launcher"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:clearTaskOnLaunch="true"
                      android:configChanges="keyboard|keyboardHidden|navigation|orientation|screenSize|screenLayout"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:screenOrientation="landscape"
                      android:stateNotNeeded="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.HOME" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.LAUNCHER" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <activity
                      android:name=".AppsActivity"
                      android:configChanges="keyboard|keyboardHidden|navigation|orientation|screenSize|screenLayout"
                      android:exported="false"
                      android:screenOrientation="landscape" />
              </application>
          </manifest>
          EOF_ARQUIVO
          mkdir -p 'app/src/main/java/br/eduarda/launcher'
          cat > 'app/src/main/java/br/eduarda/launcher/AppItem.java' <<'EOF_ARQUIVO'
          package br.eduarda.launcher;

          import android.content.Intent;
          import android.graphics.drawable.Drawable;

          public class AppItem {
              public final String packageName;
              public final String label;
              public final Drawable icon;
              public final Intent launchIntent;

              public AppItem(String packageName, String label, Drawable icon, Intent launchIntent) {
                  this.packageName = packageName;
                  this.label = label;
                  this.icon = icon;
                  this.launchIntent = launchIntent;
              }
          }
          EOF_ARQUIVO
          mkdir -p 'app/src/main/java/br/eduarda/launcher'
          cat > 'app/src/main/java/br/eduarda/launcher/AppRepository.java' <<'EOF_ARQUIVO'
          package br.eduarda.launcher;

          import android.content.ActivityNotFoundException;
          import android.content.ComponentName;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.PackageManager;
          import android.content.pm.ResolveInfo;
          import android.text.TextUtils;
          import android.widget.Toast;

          import java.text.Collator;
          import java.util.ArrayList;
          import java.util.Arrays;
          import java.util.Collections;
          import java.util.Comparator;
          import java.util.LinkedHashMap;
          import java.util.List;
          import java.util.Locale;
          import java.util.Map;

          /** Lista os apps instalados e guarda quais estão na fileira giratória. */
          public final class AppRepository {

              private static final String PREFS = "launcher";
              private static final String KEY_FAVS = "favoritos";

              private AppRepository() { }

              public static List<AppItem> loadAllApps(Context ctx) {
                  PackageManager pm = ctx.getPackageManager();
                  Map<String, AppItem> map = new LinkedHashMap<>();
                  // Primeiro os apps feitos para TV, depois os comuns (de celular)
                  addFrom(ctx, pm, Intent.CATEGORY_LEANBACK_LAUNCHER, map);
                  addFrom(ctx, pm, Intent.CATEGORY_LAUNCHER, map);

                  List<AppItem> list = new ArrayList<>(map.values());
                  final Collator collator = Collator.getInstance(new Locale("pt", "BR"));
                  Collections.sort(list, new Comparator<AppItem>() {
                      @Override
                      public int compare(AppItem a, AppItem b) {
                          return collator.compare(a.label, b.label);
                      }
                  });
                  return list;
              }

              private static void addFrom(Context ctx, PackageManager pm, String category, Map<String, AppItem> map) {
                  Intent query = new Intent(Intent.ACTION_MAIN).addCategory(category);
                  List<ResolveInfo> results = pm.queryIntentActivities(query, 0);
                  for (ResolveInfo ri : results) {
                      String pkg = ri.activityInfo.packageName;
                      if (pkg.equals(ctx.getPackageName()) || map.containsKey(pkg)) continue;

                      Intent launch = new Intent(Intent.ACTION_MAIN)
                              .addCategory(category)
                              .setComponent(new ComponentName(pkg, ri.activityInfo.name))
                              .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_RESET_TASK_IF_NEEDED);

                      CharSequence label = ri.loadLabel(pm);
                      map.put(pkg, new AppItem(pkg, label == null ? pkg : label.toString(), ri.loadIcon(pm), launch));
                  }
              }

              public static void launch(Context ctx, AppItem item) {
                  try {
                      ctx.startActivity(item.launchIntent);
                  } catch (ActivityNotFoundException | SecurityException e) {
                      Toast.makeText(ctx, "Não foi possível abrir " + item.label, Toast.LENGTH_SHORT).show();
                  }
              }

              // ---------- Fileira (favoritos) ----------

              private static SharedPreferences prefs(Context ctx) {
                  return ctx.getSharedPreferences(PREFS, Context.MODE_PRIVATE);
              }

              public static boolean hasSavedFavorites(Context ctx) {
                  return prefs(ctx).contains(KEY_FAVS);
              }

              public static List<String> getFavorites(Context ctx) {
                  String s = prefs(ctx).getString(KEY_FAVS, "");
                  if (TextUtils.isEmpty(s)) return new ArrayList<>();
                  return new ArrayList<>(Arrays.asList(s.split("\\|")));
              }

              public static void saveFavorites(Context ctx, List<String> pkgs) {
                  prefs(ctx).edit().putString(KEY_FAVS, TextUtils.join("|", pkgs)).apply();
              }

              /** Coloca ou tira o app da fileira. Retorna true se ele ficou na fileira. */
              public static boolean toggleFavorite(Context ctx, String pkg) {
                  List<String> favs = getFavorites(ctx);
                  boolean nowFav;
                  if (favs.contains(pkg)) {
                      favs.remove(pkg);
                      nowFav = false;
                  } else {
                      favs.add(pkg);
                      nowFav = true;
                  }
                  saveFavorites(ctx, favs);
                  return nowFav;
              }

              /** Monta a lista da fileira na ordem salva, ignorando apps desinstalados. */
              public static List<AppItem> favoriteItems(Context ctx, List<AppItem> all) {
                  if (!hasSavedFavorites(ctx)) {
                      // Primeira vez: já começa com os 5 primeiros apps de TV
                      List<String> seed = new ArrayList<>();
                      for (int i = 0; i < all.size() && i < 5; i++) seed.add(all.get(i).packageName);
                      saveFavorites(ctx, seed);
                  }
                  Map<String, AppItem> byPkg = new LinkedHashMap<>();
                  for (AppItem a : all) byPkg.put(a.packageName, a);

                  List<AppItem> out = new ArrayList<>();
                  for (String pkg : getFavorites(ctx)) {
                      AppItem a = byPkg.get(pkg);
                      if (a != null) out.add(a);
                  }
                  return out;
              }
          }
          EOF_ARQUIVO
          mkdir -p 'app/src/main/java/br/eduarda/launcher'
          cat > 'app/src/main/java/br/eduarda/launcher/AppsActivity.java' <<'EOF_ARQUIVO'
          package br.eduarda.launcher;

          import android.app.Activity;
          import android.os.Bundle;
          import android.view.KeyEvent;
          import android.view.LayoutInflater;
          import android.view.TextureView;
          import android.view.View;
          import android.view.ViewGroup;
          import android.widget.AdapterView;
          import android.widget.BaseAdapter;
          import android.widget.GridView;
          import android.widget.ImageView;
          import android.widget.TextView;
          import android.widget.Toast;

          import java.util.ArrayList;
          import java.util.List;

          /** Grade com todos os apps. Segurar OK coloca/tira o app da fileira. */
          public class AppsActivity extends Activity {

              private GridView grid;
              private final List<AppItem> apps = new ArrayList<>();
              private List<String> favs = new ArrayList<>();
              private Adapter adapter;
              private BackgroundManager background;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_apps);

                  background = new BackgroundManager(this,
                          (ImageView) findViewById(R.id.wallpaper), (TextureView) findViewById(R.id.video));

                  grid = findViewById(R.id.grid);
                  adapter = new Adapter();
                  grid.setAdapter(adapter);

                  grid.setOnItemClickListener(new AdapterView.OnItemClickListener() {
                      @Override
                      public void onItemClick(AdapterView<?> parent, View view, int position, long id) {
                          AppRepository.launch(AppsActivity.this, apps.get(position));
                      }
                  });
                  grid.setOnItemLongClickListener(new AdapterView.OnItemLongClickListener() {
                      @Override
                      public boolean onItemLongClick(AdapterView<?> parent, View view, int position, long id) {
                          toggle(position);
                          return true;
                      }
                  });
                  grid.requestFocus();
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  background.onResume();
                  apps.clear();
                  apps.addAll(AppRepository.loadAllApps(this));
                  AppRepository.favoriteItems(this, apps); // garante a lista inicial
                  favs = AppRepository.getFavorites(this);
                  adapter.notifyDataSetChanged();
              }

              @Override
              protected void onPause() {
                  super.onPause();
                  background.onPause();
              }

              @Override
              public boolean onKeyDown(int keyCode, KeyEvent event) {
                  // Alguns controles têm botão MENU: também serve para colocar/tirar da fileira
                  if (keyCode == KeyEvent.KEYCODE_MENU) {
                      int pos = grid.getSelectedItemPosition();
                      if (pos != GridView.INVALID_POSITION) {
                          toggle(pos);
                          return true;
                      }
                  }
                  return super.onKeyDown(keyCode, event);
              }

              private void toggle(int position) {
                  AppItem item = apps.get(position);
                  boolean nowFav = AppRepository.toggleFavorite(this, item.packageName);
                  favs = AppRepository.getFavorites(this);
                  adapter.notifyDataSetChanged();
                  Toast.makeText(this, item.label + (nowFav ? " entrou na fileira ★" : " saiu da fileira"),
                          Toast.LENGTH_SHORT).show();
              }

              private class Adapter extends BaseAdapter {
                  @Override
                  public int getCount() {
                      return apps.size();
                  }

                  @Override
                  public Object getItem(int position) {
                      return apps.get(position);
                  }

                  @Override
                  public long getItemId(int position) {
                      return position;
                  }

                  @Override
                  public View getView(int position, View convertView, ViewGroup parent) {
                      View v = convertView;
                      if (v == null) {
                          v = LayoutInflater.from(AppsActivity.this).inflate(R.layout.item_app, parent, false);
                      }
                      AppItem item = apps.get(position);
                      ((ImageView) v.findViewById(R.id.icon)).setImageDrawable(item.icon);
                      ((TextView) v.findViewById(R.id.label)).setText(item.label);
                      v.findViewById(R.id.star).setVisibility(
                              favs.contains(item.packageName) ? View.VISIBLE : View.INVISIBLE);
                      return v;
                  }
              }
          }
          EOF_ARQUIVO
          mkdir -p 'app/src/main/java/br/eduarda/launcher'
          cat > 'app/src/main/java/br/eduarda/launcher/BackgroundManager.java' <<'EOF_ARQUIVO'
          package br.eduarda.launcher;

          import android.app.Activity;
          import android.content.Context;
          import android.graphics.Bitmap;
          import android.graphics.BitmapFactory;
          import android.graphics.Color;
          import android.graphics.Matrix;
          import android.graphics.SurfaceTexture;
          import android.graphics.drawable.Animatable;
          import android.graphics.drawable.BitmapDrawable;
          import android.graphics.drawable.ColorDrawable;
          import android.graphics.drawable.Drawable;
          import android.graphics.ImageDecoder;
          import android.media.MediaPlayer;
          import android.os.Build;
          import android.util.DisplayMetrics;
          import android.view.Surface;
          import android.view.TextureView;
          import android.view.View;
          import android.view.Window;
          import android.view.WindowManager;
          import android.widget.ImageView;

          import java.io.File;
          import java.io.FileInputStream;
          import java.io.FileOutputStream;
          import java.io.IOException;
          import java.io.InputStream;
          import java.io.OutputStream;

          /**
           * Cuida do fundo da tela. Tipos de fundo:
           *  - padrao  : degradê azul
           *  - imagem  : foto (JPG/PNG) ou GIF/WebP animado
           *  - video   : vídeo MP4 em loop, sem som (o "live wallpaper" próprio do launcher)
           *  - sistema : live wallpaper do Android (se a TV box suportar)
           */
          public class BackgroundManager implements TextureView.SurfaceTextureListener {

              public static final String MODE_DEFAULT = "padrao";
              public static final String MODE_IMAGE = "imagem";
              public static final String MODE_VIDEO = "video";
              public static final String MODE_SYSTEM = "sistema";

              private static final String PREFS = "launcher";
              private static final String KEY_MODE = "fundo";

              private final Activity activity;
              private final ImageView image;
              private final TextureView video;
              private MediaPlayer player;
              private Surface surface;
              private boolean resumed;

              public BackgroundManager(Activity activity, ImageView image, TextureView video) {
                  this.activity = activity;
                  this.image = image;
                  this.video = video;
                  video.setSurfaceTextureListener(this);
              }

              // ---------- Preferência ----------

              public static String getMode(Context ctx) {
                  return ctx.getSharedPreferences(PREFS, Context.MODE_PRIVATE).getString(KEY_MODE, MODE_DEFAULT);
              }

              public static void setMode(Context ctx, String mode) {
                  ctx.getSharedPreferences(PREFS, Context.MODE_PRIVATE).edit().putString(KEY_MODE, mode).apply();
              }

              private static File imageFile(Context ctx) {
                  return new File(ctx.getFilesDir(), "fundo_imagem");
              }

              private static File videoFile(Context ctx) {
                  return new File(ctx.getFilesDir(), "fundo_video.mp4");
              }

              /** Copia a imagem/vídeo para dentro do app. Rode fora da thread principal (vídeo pode ser grande). */
              public static boolean importFile(Context ctx, InputStream in, boolean isVideo) {
                  if (in == null) return false;
                  File tmp = new File(ctx.getFilesDir(), "fundo.tmp");
                  OutputStream out = null;
                  try {
                      out = new FileOutputStream(tmp);
                      byte[] buf = new byte[64 * 1024];
                      int n;
                      while ((n = in.read(buf)) > 0) out.write(buf, 0, n);
                      out.close();
                      out = null;
                      if (!isVideo) {
                          BitmapFactory.Options o = new BitmapFactory.Options();
                          o.inJustDecodeBounds = true;
                          BitmapFactory.decodeFile(tmp.getAbsolutePath(), o);
                          if (o.outWidth <= 0 || o.outHeight <= 0) {
                              tmp.delete();
                              return false;
                          }
                      } else if (tmp.length() == 0) {
                          tmp.delete();
                          return false;
                      }
                      File dest = isVideo ? videoFile(ctx) : imageFile(ctx);
                      dest.delete();
                      return tmp.renameTo(dest);
                  } catch (IOException e) {
                      tmp.delete();
                      return false;
                  } finally {
                      try { in.close(); } catch (IOException ignored) { }
                      if (out != null) try { out.close(); } catch (IOException ignored) { }
                  }
              }

              // ---------- Ciclo de vida ----------

              public void onResume() {
                  resumed = true;
                  apply();
              }

              public void onPause() {
                  resumed = false;
                  stopVideo();
                  Drawable d = image.getDrawable();
                  if (d instanceof Animatable) ((Animatable) d).stop();
              }

              /** Reaplica o fundo conforme o tipo escolhido. */
              public void apply() {
                  String mode = getMode(activity);
                  stopVideo();

                  Window w = activity.getWindow();
                  if (MODE_SYSTEM.equals(mode)) {
                      // Janela transparente: aparece o live wallpaper do Android por trás
                      w.addFlags(WindowManager.LayoutParams.FLAG_SHOW_WALLPAPER);
                      w.setBackgroundDrawable(new ColorDrawable(Color.TRANSPARENT));
                  } else {
                      w.clearFlags(WindowManager.LayoutParams.FLAG_SHOW_WALLPAPER);
                      w.setBackgroundDrawableResource(R.drawable.bg_default);
                  }

                  image.setImageDrawable(null);
                  image.setVisibility(View.GONE);
                  video.setVisibility(View.GONE);

                  if (MODE_IMAGE.equals(mode)) {
                      Drawable d = loadImage();
                      if (d != null) {
                          image.setImageDrawable(d);
                          image.setVisibility(View.VISIBLE);
                          if (d instanceof Animatable) ((Animatable) d).start();
                      }
                  } else if (MODE_VIDEO.equals(mode) && videoFile(activity).exists()) {
                      video.setVisibility(View.VISIBLE);
                      if (resumed) startVideo();
                  }
              }

              // ---------- Imagem / GIF ----------

              private static boolean isAnimatedFormat(File f) {
                  byte[] h = new byte[12];
                  try (FileInputStream in = new FileInputStream(f)) {
                      if (in.read(h) < 12) return false;
                  } catch (IOException e) {
                      return false;
                  }
                  boolean gif = h[0] == 'G' && h[1] == 'I' && h[2] == 'F';
                  boolean webp = h[0] == 'R' && h[1] == 'I' && h[2] == 'F' && h[3] == 'F'
                          && h[8] == 'W' && h[9] == 'E' && h[10] == 'B' && h[11] == 'P';
                  return gif || webp;
              }

              private Drawable loadImage() {
                  File f = imageFile(activity);
                  if (!f.exists()) return null;

                  if (Build.VERSION.SDK_INT >= 28 && isAnimatedFormat(f)) {
                      try {
                          return ImageDecoder.decodeDrawable(ImageDecoder.createSource(f));
                      } catch (IOException | OutOfMemoryError ignored) {
                          // cai para imagem parada
                      }
                  }

                  DisplayMetrics dm = activity.getResources().getDisplayMetrics();
                  BitmapFactory.Options o = new BitmapFactory.Options();
                  o.inJustDecodeBounds = true;
                  BitmapFactory.decodeFile(f.getAbsolutePath(), o);
                  int sample = 1;
                  while (o.outWidth / (sample * 2) >= dm.widthPixels && o.outHeight / (sample * 2) >= dm.heightPixels) {
                      sample *= 2;
                  }
                  o.inJustDecodeBounds = false;
                  o.inSampleSize = sample;
                  o.inPreferredConfig = Bitmap.Config.RGB_565;
                  try {
                      Bitmap b = BitmapFactory.decodeFile(f.getAbsolutePath(), o);
                      return b == null ? null : new BitmapDrawable(activity.getResources(), b);
                  } catch (OutOfMemoryError e) {
                      return null;
                  }
              }

              // ---------- Vídeo ----------

              private void startVideo() {
                  if (surface == null || player != null) return;
                  File f = videoFile(activity);
                  if (!f.exists()) return;
                  try {
                      player = new MediaPlayer();
                      player.setDataSource(f.getAbsolutePath());
                      player.setSurface(surface);
                      player.setLooping(true);
                      player.setVolume(0f, 0f);
                      player.setOnVideoSizeChangedListener(new MediaPlayer.OnVideoSizeChangedListener() {
                          @Override
                          public void onVideoSizeChanged(MediaPlayer mp, int width, int height) {
                              fitCenterCrop(width, height);
                          }
                      });
                      player.setOnPreparedListener(new MediaPlayer.OnPreparedListener() {
                          @Override
                          public void onPrepared(MediaPlayer mp) {
                              if (resumed && mp == player) mp.start();
                          }
                      });
                      player.setOnErrorListener(new MediaPlayer.OnErrorListener() {
                          @Override
                          public boolean onError(MediaPlayer mp, int what, int extra) {
                              stopVideo();
                              video.setVisibility(View.GONE);
                              return true;
                          }
                      });
                      player.prepareAsync();
                  } catch (IOException | RuntimeException e) {
                      stopVideo();
                      video.setVisibility(View.GONE);
                  }
              }

              private void stopVideo() {
                  if (player != null) {
                      try {
                          player.release();
                      } catch (RuntimeException ignored) { }
                      player = null;
                  }
              }

              /** Faz o vídeo preencher a tela inteira, cortando as bordas se precisar. */
              private void fitCenterCrop(int vw, int vh) {
                  int w = video.getWidth();
                  int h = video.getHeight();
                  if (vw <= 0 || vh <= 0 || w <= 0 || h <= 0) return;
                  float scale = Math.max((float) w / vw, (float) h / vh);
                  float sx = vw * scale / w;
                  float sy = vh * scale / h;
                  Matrix m = new Matrix();
                  m.setScale(sx, sy, w / 2f, h / 2f);
                  video.setTransform(m);
              }

              @Override
              public void onSurfaceTextureAvailable(SurfaceTexture st, int width, int height) {
                  surface = new Surface(st);
                  if (resumed && MODE_VIDEO.equals(getMode(activity))) startVideo();
              }

              @Override
              public void onSurfaceTextureSizeChanged(SurfaceTexture st, int width, int height) {
                  if (player != null) fitCenterCrop(player.getVideoWidth(), player.getVideoHeight());
              }

              @Override
              public boolean onSurfaceTextureDestroyed(SurfaceTexture st) {
                  stopVideo();
                  if (surface != null) {
                      surface.release();
                      surface = null;
                  }
                  return true;
              }

              @Override
              public void onSurfaceTextureUpdated(SurfaceTexture st) { }
          }
          EOF_ARQUIVO
          mkdir -p 'app/src/main/java/br/eduarda/launcher'
          cat > 'app/src/main/java/br/eduarda/launcher/CarouselView.java' <<'EOF_ARQUIVO'
          package br.eduarda.launcher;

          import android.content.Context;
          import android.graphics.drawable.Drawable;
          import android.util.AttributeSet;
          import android.util.TypedValue;
          import android.view.Gravity;
          import android.view.KeyEvent;
          import android.view.View;
          import android.widget.ImageView;
          import android.widget.LinearLayout;

          import java.util.ArrayList;
          import java.util.List;

          /**
           * Fileira giratória: o app do meio fica em destaque e as setas
           * esquerda/direita giram a fileira sem fim (dá a volta).
           */
          public class CarouselView extends LinearLayout {

              public interface Listener {
                  void onCenterChanged(AppItem item);
              }

              private static final int MAX_VISIBLE = 5;
              private static final int SLOT_DP = 140;
              private static final int MARGIN_DP = 18;

              private List<AppItem> items = new ArrayList<>();
              private final List<ImageView> slots = new ArrayList<>();
              private int center = 0;
              private Listener listener;

              public CarouselView(Context context) {
                  this(context, null);
              }

              public CarouselView(Context context, AttributeSet attrs) {
                  super(context, attrs);
                  setOrientation(HORIZONTAL);
                  setGravity(Gravity.CENTER);
                  setClipChildren(false);
                  setClipToPadding(false);
                  setFocusable(true);
                  setClickable(true);
                  setLongClickable(true);
                  setOnFocusChangeListener(new OnFocusChangeListener() {
                      @Override
                      public void onFocusChange(View v, boolean hasFocus) {
                          refresh(0);
                      }
                  });
              }

              public void setListener(Listener l) {
                  listener = l;
              }

              public AppItem getCenterItem() {
                  return items.isEmpty() ? null : items.get(center);
              }

              public void setItems(List<AppItem> newItems) {
                  String keepPkg = getCenterItem() == null ? null : getCenterItem().packageName;
                  items = newItems;
                  center = 0;
                  if (keepPkg != null) {
                      for (int i = 0; i < items.size(); i++) {
                          if (items.get(i).packageName.equals(keepPkg)) {
                              center = i;
                              break;
                          }
                      }
                  }
                  rebuild();
              }

              private int dp(int v) {
                  return (int) TypedValue.applyDimension(TypedValue.COMPLEX_UNIT_DIP, v,
                          getResources().getDisplayMetrics());
              }

              private int visibleCount() {
                  int n = items.size();
                  if (n == 0) return 0;
                  if (n >= MAX_VISIBLE) return MAX_VISIBLE;
                  return (n % 2 == 1) ? n : n - 1; // sempre ímpar, para ter um "meio"
              }

              private static int mod(int a, int n) {
                  return ((a % n) + n) % n;
              }

              private void rebuild() {
                  removeAllViews();
                  slots.clear();
                  int v = visibleCount();
                  int size = dp(SLOT_DP);
                  for (int i = 0; i < v; i++) {
                      ImageView iv = new ImageView(getContext());
                      iv.setScaleType(ImageView.ScaleType.FIT_CENTER);
                      int pad = dp(16);
                      iv.setPadding(pad, pad, pad, pad);
                      LayoutParams lp = new LayoutParams(size, size);
                      lp.leftMargin = dp(MARGIN_DP);
                      lp.rightMargin = dp(MARGIN_DP);
                      final int slotIndex = i;
                      iv.setOnClickListener(new OnClickListener() {
                          @Override
                          public void onClick(View view) {
                              // Toque/mouse: clicar num lado gira; clicar no meio abre
                              int half = slots.size() / 2;
                              if (slotIndex == half) {
                                  performClick();
                              } else {
                                  rotate(slotIndex - half);
                              }
                          }
                      });
                      addView(iv, lp);
                      slots.add(iv);
                  }
                  refresh(0);
              }

              private Drawable copyOf(Drawable d) {
                  if (d == null) return null;
                  Drawable.ConstantState cs = d.getConstantState();
                  return cs != null ? cs.newDrawable(getResources()) : d;
              }

              /** direction: +1 girou para a direita, -1 para a esquerda, 0 sem animação de giro. */
              private void refresh(int direction) {
                  int v = slots.size();
                  int half = v / 2;
                  int step = dp(SLOT_DP + 2 * MARGIN_DP);
                  for (int i = 0; i < v; i++) {
                      int idx = mod(center - half + i, items.size());
                      ImageView iv = slots.get(i);
                      iv.setImageDrawable(copyOf(items.get(idx).icon));

                      int dist = Math.abs(i - half);
                      float scale = dist == 0 ? 1.25f : (dist == 1 ? 0.9f : 0.7f);
                      float alpha = dist == 0 ? 1f : (dist == 1 ? 0.75f : 0.45f);
                      iv.setBackgroundResource(dist == 0 && hasFocus() ? R.drawable.center_bg : 0);

                      iv.animate().cancel();
                      if (direction != 0) iv.setTranslationX(direction * step * 0.5f);
                      iv.animate().translationX(0f).scaleX(scale).scaleY(scale).alpha(alpha)
                              .setDuration(180).start();
                  }
                  if (listener != null) listener.onCenterChanged(getCenterItem());
              }

              private void rotate(int delta) {
                  if (items.isEmpty()) return;
                  center = mod(center + delta, items.size());
                  refresh(delta > 0 ? 1 : -1);
              }

              @Override
              public boolean onKeyDown(int keyCode, KeyEvent event) {
                  if (!items.isEmpty()) {
                      if (keyCode == KeyEvent.KEYCODE_DPAD_LEFT) {
                          rotate(-1);
                          return true;
                      }
                      if (keyCode == KeyEvent.KEYCODE_DPAD_RIGHT) {
                          rotate(1);
                          return true;
                      }
                  }
                  return super.onKeyDown(keyCode, event);
              }
          }
