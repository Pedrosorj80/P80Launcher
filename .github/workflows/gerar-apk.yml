          package br.eduardo.p80launcher;

          import android.Manifest;
          import android.app.Activity;
          import android.app.AlertDialog;
          import android.content.ActivityNotFoundException;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.widget.Toast;

          import java.io.File;
          import java.io.FileInputStream;
          import java.io.IOException;
          import java.io.InputStream;
          import java.util.ArrayList;
          import java.util.Arrays;
          import java.util.List;
          import java.util.Locale;

          /**
           * Base das telas do launcher: menu de opções de cada app
           * (fileira e imagem personalizada).
           */
          public abstract class LauncherActivity extends Activity {

              private static final int REQ_ICON_PICK = 10;
              private static final int REQ_ICON_STORAGE = 11;
              private static final String KEY_PENDING = "pendingIconPkg";

              private String pendingIconPkg;

              /** Chamado quando a fileira ou alguma imagem de app mudou. */
              protected abstract void onAppsChanged();

              private interface Opener {
                  InputStream open() throws IOException;
              }

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  if (savedInstanceState != null) pendingIconPkg = savedInstanceState.getString(KEY_PENDING);
              }

              @Override
              protected void onSaveInstanceState(Bundle outState) {
                  super.onSaveInstanceState(outState);
                  outState.putString(KEY_PENDING, pendingIconPkg);
              }

              protected void showAppOptions(final AppItem item) {
                  if (item == null) return;
                  boolean fav = AppRepository.getFavorites(this).contains(item.packageName);
                  final List<String> labels = new ArrayList<>();
                  final List<Integer> actions = new ArrayList<>();
                  labels.add(fav ? "Tirar da fileira" : "Colocar na fileira ★");
                  actions.add(0);
                  labels.add("Trocar imagem (galeria / arquivos)");
                  actions.add(1);
                  labels.add("Trocar imagem (pasta Download)");
                  actions.add(2);
                  if (item.customImage) {
                      labels.add("Voltar ao ícone original");
                      actions.add(3);
                  }

                  new AlertDialog.Builder(this)
                          .setTitle(item.label)
                          .setItems(labels.toArray(new String[0]), (d, which) -> {
                              switch (actions.get(which)) {
                                  case 0:
                                      boolean now = AppRepository.toggleFavorite(this, item.packageName);
                                      Toast.makeText(this, item.label + (now ? " entrou na fileira ★" : " saiu da fileira"),
                                              Toast.LENGTH_SHORT).show();
                                      onAppsChanged();
                                      break;
                                  case 1:
                                      pendingIconPkg = item.packageName;
                                      pickFromGallery();
                                      break;
                                  case 2:
                                      pendingIconPkg = item.packageName;
                                      pickFromDownloadWithPermission();
                                      break;
                                  default:
                                      IconStore.clear(this, item.packageName);
                                      onAppsChanged();
                              }
                          })
                          .show();
              }

              private void pickFromGallery() {
                  Intent i = new Intent(Intent.ACTION_GET_CONTENT);
                  i.setType("image/*");
                  i.addCategory(Intent.CATEGORY_OPENABLE);
                  if (i.resolveActivity(getPackageManager()) != null) {
                      try {
                          startActivityForResult(i, REQ_ICON_PICK);
                          return;
                      } catch (ActivityNotFoundException ignored) { }
                  }
                  Toast.makeText(this, "Sua TV box não tem seletor de imagens. Use a opção da pasta Download.",
                          Toast.LENGTH_LONG).show();
              }

              private void pickFromDownloadWithPermission() {
                  if (Build.VERSION.SDK_INT >= 23
                          && checkSelfPermission(Manifest.permission.READ_EXTERNAL_STORAGE)
                          != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(new String[]{Manifest.permission.READ_EXTERNAL_STORAGE}, REQ_ICON_STORAGE);
                      return;
                  }
                  showDownloadImages();
              }

              private void showDownloadImages() {
                  File dir = Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS);
                  File[] found = dir.listFiles(f -> {
                      String n = f.getName().toLowerCase(Locale.ROOT);
                      return f.isFile() && (n.endsWith(".jpg") || n.endsWith(".jpeg") || n.endsWith(".png")
                              || n.endsWith(".webp") || n.endsWith(".gif"));
                  });
                  if (found == null || found.length == 0) {
                      Toast.makeText(this, "Coloque imagens (.jpg ou .png) em " + dir.getAbsolutePath(),
                              Toast.LENGTH_LONG).show();
                      return;
                  }
                  final File[] files = found;
                  Arrays.sort(files, (a, b) -> a.getName().compareToIgnoreCase(b.getName()));
                  String[] names = new String[files.length];
                  for (int i = 0; i < files.length; i++) names[i] = files[i].getName();

                  new AlertDialog.Builder(this)
                          .setTitle("Escolha a imagem")
                          .setItems(names, (d, which) -> importIcon(() -> new FileInputStream(files[which])))
                          .show();
              }

              private void importIcon(final Opener opener) {
                  final String pkg = pendingIconPkg;
                  if (pkg == null) return;
                  new Thread(() -> {
                      boolean ok;
                      try {
                          ok = IconStore.save(this, pkg, opener.open());
                      } catch (IOException | SecurityException e) {
                          ok = false;
                      }
                      final boolean result = ok;
                      runOnUiThread(() -> {
                          Toast.makeText(this, result ? "Imagem aplicada!" : "Não consegui usar essa imagem",
                                  Toast.LENGTH_SHORT).show();
                          if (result) onAppsChanged();
                      });
                  }).start();
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (requestCode == REQ_ICON_PICK && resultCode == RESULT_OK && data != null && data.getData() != null) {
                      final Uri uri = data.getData();
                      importIcon(() -> getContentResolver().openInputStream(uri));
                  }
              }

              @Override
              public void onRequestPermissionsResult(int requestCode, String[] permissions, int[] grantResults) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults);
                  if (requestCode == REQ_ICON_STORAGE) {
                      if (grantResults.length > 0 && grantResults[0] == PackageManager.PERMISSION_GRANTED) {
                          showDownloadImages();
                      } else {
                          Toast.makeText(this, "Sem permissão para ler a pasta Download", Toast.LENGTH_LONG).show();
                      }
                  }
              }
          }
