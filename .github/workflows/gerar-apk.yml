          </resources>
          EOF_ARQUIVO
          mkdir -p '.'
          cat > 'build.gradle' <<'EOF_ARQUIVO'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF_ARQUIVO
          mkdir -p '.'
          cat > 'gradle.properties' <<'EOF_ARQUIVO'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=false
          EOF_ARQUIVO
          mkdir -p '.'
          cat > 'settings.gradle' <<'EOF_ARQUIVO'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "P80Launcher"
          include ':app'
          EOF_ARQUIVO
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Compilar
        run: gradle assembleDebug --no-daemon
      - name: Publicar APK na página Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk P80Launcher.apk
          gh release delete ultima-versao -y --cleanup-tag || true
          gh release create ultima-versao P80Launcher.apk -t "P80Launcher" -n "APK gerado automaticamente"
