                  android:id="@+id/label"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="8dp"
                  android:ellipsize="end"
                  android:gravity="center"
                  android:maxLines="2"
                  android:textColor="#FFFFFF"
                  android:textSize="15sp" />
          </LinearLayout>
          EOF_ARQUIVO
          mkdir -p 'app/src/main/res/values'
          cat > 'app/src/main/res/values/styles.xml' <<'EOF_ARQUIVO'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="android:Theme.Material.NoActionBar.Fullscreen">
                  <item name="android:windowBackground">@drawable/bg_default</item>
                  <item name="android:colorAccent">#4FC3F7</item>
              </style>

              <style name="MenuButton">
                  <item name="android:layout_width">wrap_content</item>
                  <item name="android:layout_height">wrap_content</item>
                  <item name="android:layout_marginLeft">12dp</item>
                  <item name="android:layout_marginRight">12dp</item>
                  <item name="android:paddingLeft">28dp</item>
                  <item name="android:paddingRight">28dp</item>
                  <item name="android:paddingTop">12dp</item>
                  <item name="android:paddingBottom">12dp</item>
                  <item name="android:background">@drawable/item_bg</item>
                  <item name="android:focusable">true</item>
                  <item name="android:clickable">true</item>
                  <item name="android:textColor">#FFFFFF</item>
                  <item name="android:textSize">18sp</item>
              </style>
          </resources>
          EOF_ARQUIVO
          mkdir -p '.'
          cat > 'build.gradle' <<'EOF_ARQUIVO'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF_ARQUIVO
          mkdir -p '.'
          cat > 'gradle.properties' <<'EOF_ARQUIVO'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=false
          EOF_ARQUIVO
          mkdir -p '.'
          cat > 'settings.gradle' <<'EOF_ARQUIVO'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "MeuLauncher"
          include ':app'
          EOF_ARQUIVO
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Compilar
        run: gradle assembleDebug --no-daemon
      - name: Publicar APK na página Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk MeuLauncher.apk
          gh release delete ultima-versao -y --cleanup-tag || true
          gh release create ultima-versao MeuLauncher.apk -t "Meu Launcher" -n "APK gerado automaticamente"
